<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="agzZGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="agzBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="agzDotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded squircle badge with subtle high-tech borders -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#agzBgGrad)" stroke="#1e293b" stroke-width="12"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.35"/>
  <!-- Monogram AGZ Text -->
  <g font-family="Outfit, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="185" font-weight="900" letter-spacing="-4">
    <text x="64" y="320" fill="#ffffff">AG</text>
    <text x="328" y="320" fill="url(#agzZGrad)">Z</text>
  </g>
  <!-- Vibrant Cyan Glowing Dot -->
  <circle cx="422" cy="308" r="14" fill="#22d3ee" filter="url(#agzDotGlow)"/>
</svg>